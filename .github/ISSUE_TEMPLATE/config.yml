blank_issues_enabled: false
contact_links:
  - name: Problem with engrt itself (install, CLI, auth, policy, audit, MCP)
    url: https://github.com/engineeringruntime/engineering-runtime-releases/issues/new/choose
    about: Runtime bugs and feature requests go to the releases repository. This repository is for capability files only.
  - name: Question about using Engineering Runtime or a capability
    url: https://github.com/orgs/engineeringruntime/discussions/categories/q-a
    about: Ask in Discussions (Q&A). Someone can mark the answer.
  - name: An idea that is not concrete yet
    url: https://github.com/orgs/engineeringruntime/discussions/categories/ideas
    about: Discuss it in Discussions (Ideas) first; open an issue once it is concrete.
  - name: Security vulnerability
    url: https://github.com/engineeringruntime/engineering-runtime-capabilities/security/policy
    about: Do not open a public issue. Email support@engineeringruntime.com as the security policy describes.
