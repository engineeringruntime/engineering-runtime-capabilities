name: A capability does not work
description: A capability in this repository fails, gives a wrong result, or its documentation is wrong.
title: "[capability] <name>: <what goes wrong>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a capability file in this repository. If `engrt` itself misbehaves
        (install, auth, policy, audit, a provider operation outside a capability), report it in
        [engineering-runtime-releases](https://github.com/engineeringruntime/engineering-runtime-releases/issues/new/choose).

        **Remove tokens, private repository names and personal data from everything you paste.**
  - type: input
    id: capability
    attributes:
      label: Capability
      description: Its name as `engrt capability list` shows it.
      placeholder: github/repo-standards-drift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: engrt version
      description: Output of `engrt version`.
      placeholder: engrt 0.13.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Windows (x64)
        - Windows (Arm64)
        - CI runner (say which below)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - validate
        - plan
        - execute
        - the result is wrong (execute succeeded)
        - the documentation in the file is wrong
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The full command with its `--input` values. Replace private names with placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, including the step that failed (`--output json` shows it as `failed_step`).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: config
    attributes:
      label: Configuration
      options:
        - configs/config.yaml and configs/policy.yaml from this repository, unchanged
        - my own config or policy (describe the relevant difference below)
        - configs/ with a different GitHub source (say which: file, os_secure_store, github_app, github_actions)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Repository visibility and GitHub plan matter for some capabilities (secret scanning, environment reviewers, rulesets on private repositories).
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed tokens, credentials and private data from this issue.
          required: true
